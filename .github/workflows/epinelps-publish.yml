name: EpinelPS 发布（R2 + 蓝奏）

on:
  release:
    types: [published]

concurrency:
  group: epinelps-publish
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'epinelps-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      R2_BUCKET: tianjg-update
      R2_PREFIX: EpinelPS
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      - name: 下载 Release 资源
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-packages
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-packages --pattern '*.tar.gz'
          ls -al release-packages/

      - name: 上传 R2 + 写索引
        run: |
          set -euo pipefail
          name=$(ls release-packages | head -n1)
          [ -n "$name" ] || { echo "::error::release $TAG 无 tar.gz"; exit 1; }
          path="release-packages/$name"
          ver=$(echo "$name" | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{2}\.[0-9]{2}(-[0-9a-f]+)?' | head -n1)
          size=$(stat -c %s "$path"); sha=$(sha256sum "$path" | cut -d' ' -f1)
          base="s3://${R2_BUCKET}/${R2_PREFIX}"
          aws s3 cp "$path" "$base/$name" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/gzip --cache-control "public, max-age=31536000, immutable"
          printf '{"version":"%s","tag":"%s","archive":"%s","size":%s,"sha256":"%s"}\n' \
            "$ver" "$TAG" "$name" "$size" "$sha" > latest.json
          aws s3 cp latest.json "$base/latest.json" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control "no-cache, max-age=30"
          aws s3 rm "$base/" --recursive --endpoint-url "$R2_ENDPOINT" --exclude "*" --include "EpinelPS-*.tar.gz" --exclude "$name"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取蓝奏云 API 库
        uses: actions/checkout@v4
        with:
          repository: AzureXuanVerse/LanZouCloud-API
          token: ${{ secrets.GH_PAT }}
          path: lanzou-api-repo
      - name: 上传蓝奏云
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
          PROJECT_NAME: EpinelPS
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet requests requests_toolbelt aiohttp asyncio
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          cp -r lanzou-api-repo/lanzou_windfollowingheart "$SITE/"
          cp lanzou-api-repo/lanzou_upload_workflow.py .
          python lanzou_upload_workflow.py

      - name: 只保留最新 1 条运行记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow epinelps-publish.yml \
            --limit 200 --json databaseId,status \
            --jq '[.[] | select(.status=="completed")] | .[1:][].databaseId' \
            | while read -r id; do
                if [ -n "$id" ]; then gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true; fi
              done
