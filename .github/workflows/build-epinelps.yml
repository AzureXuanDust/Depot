name: DIAG EpinelPS Cold Restore

on:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  diag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          repository: AzureXuanVerse/EpinelPS-P
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 保证完全冷环境
        run: |
          rm -rf "$NUGET_PACKAGES"
          rm -rf EpinelPS/obj
          rm -rf EpinelPS.Analyzers/obj

          echo "SDK:"
          dotnet --version

          echo "Commit:"
          git rev-parse HEAD

      - name: 唯一一次 Restore
        run: |
          dotnet restore EpinelPS/EpinelPS.csproj \
            --runtime win-x64 \
            -v normal
