name: Build EpinelPS

on:
  workflow_dispatch:
    inputs:
      force:
        description: 强制重建发布（即使上游未变）
        type: boolean
        default: false

concurrency:
  group: build-epinelps
  cancel-in-progress: false

env:
  SERVER_REPO: AzureXuanVerse/EpinelPS-P
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_XMLDOC_MODE: skip
  # 关键：用 workspace 内的干净包目录（照搬能跑通的旧工作流）。runner 默认的
  # ~/.nuget/packages 预置了会和源生成器冲突的 Microsoft.CodeAnalysis.*，导致还原静默失败。
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.c.outputs.build }}
      server_commit: ${{ steps.c.outputs.server_commit }}
    steps:
      - id: c
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          server_commit=$(git ls-remote "https://x-access-token:${GH_PAT}@github.com/${SERVER_REPO}.git" HEAD | cut -f1)
          echo "server_commit=$server_commit" >> "$GITHUB_OUTPUT"
          prev=$(curl -fsSL "https://upd.tianjg.com/EpinelPS/latest.json?t=$RANDOM" || echo '{}')
          ps=$(echo "$prev" | grep -o '"server_commit":"[^"]*"' | cut -d'"' -f4)
          if [ "${{ inputs.force }}" != "true" ] && [ -n "$server_commit" ] && [ "$server_commit" = "$ps" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "上游未变（server=$server_commit），跳过"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

# PLACEHOLDER

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SERVER_COMMIT: ${{ needs.check.outputs.server_commit }}
      R2_BUCKET: tianjg-update
      R2_PREFIX: EpinelPS
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
    steps:
      - name: 版本号
        run: echo "VERSION=v$(TZ=Asia/Shanghai date +%Y.%m.%d-%H.%M)-$(echo "$SERVER_COMMIT" | cut -c1-7)" >> "$GITHUB_ENV"

      - name: 检出服务端源码
        uses: actions/checkout@v4
        with:
          repository: AzureXuanVerse/EpinelPS-P
          token: ${{ secrets.GH_PAT }}
          path: server
      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/EpinelPS/EpinelPS.csproj', 'server/EpinelPS.Analyzers/EpinelPS.Analyzers.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: 构建 Windows x64 服务端
        working-directory: server
        run: |
          # 1) 钉 10.0.400：生成器 EpinelPS.Analyzers 在 runner 默认的 10.0.401 上单独还原就挂
          #    （本机 10.0.400 正常，判定为 401 回归）。
          printf '{"sdk":{"version":"10.0.400","rollForward":"disable"}}\n' > global.json
          dotnet --version
          # 2) publish 主项目时 RID/SelfContained/PublishSingleFile 会顺 ProjectReference 下传进
          #    netstandard2.0 生成器，让图还原挂；UndefineProperties 阻断下传（生成器与 RID 无关）。
          sed -i 's#ReferenceOutputAssembly="false"#ReferenceOutputAssembly="false" UndefineProperties="RuntimeIdentifier;RuntimeIdentifiers;SelfContained;PublishSingleFile"#' EpinelPS/EpinelPS.csproj
          dotnet publish EpinelPS/EpinelPS.csproj \
            --configuration Release --runtime win-x64 --self-contained true \
            -p:PublishSingleFile=true \
            --output ./bin/publish/epinelps-windows

      - name: 打包
        run: |
          set -euo pipefail
          mkdir -p release-packages
          tar -czf "release-packages/EpinelPS-${VERSION}-windows-x86_64.tar.gz" -C server/bin/publish/epinelps-windows .
          ls -lh release-packages/

      - name: 发布到 Depot Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="epinelps-${VERSION}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" release-packages/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "EpinelPS ${VERSION}" \
            --notes "EpinelPS@${SERVER_COMMIT}"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '.[].tagName | select(startswith("epinelps-"))' \
            | while read -r t; do
                if [ -n "$t" ] && [ "$t" != "$TAG" ]; then gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; fi
              done

      - name: 上传 R2 + 索引
        run: |
          set -euo pipefail
          base="s3://${R2_BUCKET}/${R2_PREFIX}"
          name="EpinelPS-${VERSION}-windows-x86_64.tar.gz"; tag="epinelps-${VERSION}"; ver="${VERSION#v}"
          size=$(stat -c %s "release-packages/$name"); sha=$(sha256sum "release-packages/$name" | cut -d' ' -f1)
          aws s3 cp "release-packages/$name" "$base/$name" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/gzip --cache-control "public, max-age=31536000, immutable"
          printf '{"version":"%s","tag":"%s","archive":"%s","size":%s,"sha256":"%s","server_commit":"%s"}\n' \
            "$ver" "$tag" "$name" "$size" "$sha" "$SERVER_COMMIT" > latest.json
          aws s3 cp latest.json "$base/latest.json" --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json --cache-control "no-cache, max-age=30"
          aws s3 rm "$base/" --recursive --endpoint-url "$R2_ENDPOINT" --exclude "*" --include "EpinelPS-*.tar.gz" --exclude "$name"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取蓝奏云 API 库
        uses: actions/checkout@v4
        with:
          repository: AzureXuanVerse/LanZouCloud-API
          token: ${{ secrets.GH_PAT }}
          path: lanzou-api-repo
      - name: 上传蓝奏云
        env:
          LANZOU_YLOGIN: ${{ secrets.LANZOU_YLOGIN }}
          LANZOU_PHPDISK_INFO: ${{ secrets.LANZOU_PHPDISK_INFO }}
          PROJECT_NAME: EpinelPS
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet requests requests_toolbelt aiohttp asyncio
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          cp -r lanzou-api-repo/lanzou_windfollowingheart "$SITE/"
          cp lanzou-api-repo/lanzou_upload_workflow.py .
          python lanzou_upload_workflow.py

  cleanup:
    needs: [check, build]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: 只保留最新 1 条运行记录
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build-epinelps.yml \
            --limit 200 --json databaseId,status \
            --jq '[.[] | select(.status=="completed")] | .[1:][].databaseId' \
            | while read -r id; do
                if [ -n "$id" ]; then gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true; fi
              done

